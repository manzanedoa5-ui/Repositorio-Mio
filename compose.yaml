services:
  api:
    build:
      context: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Set OPERATOR_TOKEN}
      REVIEWER_TOKEN: ${REVIEWER_TOKEN:?Set REVIEWER_TOKEN}
      MOBILE_TOKEN: ${MOBILE_TOKEN:?Set MOBILE_TOKEN}
    volumes: ["cases:/app/data"]
  n8n:
    image: n8nio/n8n:1.123.0
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      NO_PROXY: localhost,127.0.0.1,::1,api,n8n
      no_proxy: localhost,127.0.0.1,::1,api,n8n
    volumes: ["n8n:/home/node/.n8n"]
volumes:
  cases:
  n8n:
